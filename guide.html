<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide — Mamae Knows Borders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        html, body { font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: clip; max-width: 100vw; }
        .guide-tabs-scroll {
            display: flex; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
            gap: 8px; padding-bottom: 8px; width: 100%; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col overflow-x-hidden w-full">

    <!-- Header -->
    <div class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-earth-asia text-xl"></i>
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight text-slate-900 block leading-none">Mamae Knows <span class="text-blue-600">Borders</span></span>
                    <span class="text-xs text-slate-500 font-medium">Your Global Visa & Migration Resource</span>
                </div>
            </a>
            <a href="index.html" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-4 py-2 rounded-xl text-xs transition flex items-center">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> Back to Home
            </a>
        </div>
    </div>

    <!-- Main Guide Content Container -->
    <main class="py-12 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex-grow">
        <div id="guideContainer" class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-10 shadow-md space-y-6">
            <!-- Dynamically loaded guide content goes here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white py-8 text-center text-xs text-slate-400">
        <p>© 2026 Mamae Knows Borders. All rights reserved.</p>
    </footer>

    <!-- Load Data and Render Logic -->
    <script src="js/data.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const guideId = params.get('id');
            const container = document.getElementById('guideContainer');

            const g = guides.find(item => item.id === guideId);

            if (!g) {
                container.innerHTML = `
                    <div class="text-center py-12 space-y-4">
                        <h2 class="text-2xl font-bold text-slate-900">Guide Not Found</h2>
                        <p class="text-slate-600">The guide you are looking for doesn't exist or may have been moved.</p>
                        <a href="index.html" class="inline-block bg-blue-600 text-white font-bold px-6 py-3 rounded-xl">Return Home</a>
                    </div>
                `;
                return;
            }

            document.title = `${g.title} — Mamae Knows Borders`;

            let categoriesHtml = '';
            if (g.categories && g.categories.length > 0) {
                categoriesHtml = `
                    <div class="mb-6 guide-tabs-scroll border-b border-slate-200">
                        ${g.categories.map((cat, idx) => `
                            <button onclick="switchCategory('${cat.name.replace(/'/g, "\\'")}', this)" class="category-btn flex-shrink-0 whitespace-nowrap px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition ${idx === 0 ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}">
                                ${cat.name}
                            </button>
                        `).join('')}
                    </div>
                    <div id="categoryContent" class="bg-slate-50 p-6 rounded-2xl border border-slate-200 text-slate-800 text-sm sm:text-base leading-relaxed">
                        ${g.categories[0].content}
                    </div>
                `;
            } else {
                categoriesHtml = `
                    <div class="space-y-3 bg-slate-50 p-6 rounded-2xl border border-slate-200">
                        ${g.steps.map((step, idx) => `
                            <div class="flex items-start space-x-3 pb-3 border-b border-slate-200 last:border-0 last:pb-0">
                                <div class="bg-blue-600 text-white font-bold text-xs w-6 h-6 rounded-full flex-shrink-0 flex items-center justify-center mt-0.5">${idx + 1}</div>
                                <div class="flex-grow text-sm sm:text-base leading-relaxed">
                                    <span>${step}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            container.innerHTML = `
                <a href="index.html" class="inline-flex items-center text-sm font-bold text-blue-600 hover:text-blue-800 transition">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Back to Featured Guides
                </a>
                <div class="relative h-64 sm:h-80 rounded-2xl overflow-hidden shadow-sm">
                    <img src="${g.image}" alt="${g.title}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900/85 via-slate-900/30 to-transparent flex flex-col justify-end p-6 text-white">
                        <span class="bg-blue-600 text-xs font-bold px-3 py-1 rounded-full uppercase w-max mb-2">${g.badge}</span>
                        <h1 class="text-2xl sm:text-4xl font-extrabold leading-tight">${g.title}</h1>
                        <span class="text-xs text-slate-300 mt-2">Last Updated: ${g.lastUpdated}</span>
                    </div>
                </div>
                <div class="space-y-4 text-slate-700">
                    <p class="text-base sm:text-lg font-medium">${g.shortDesc}</p>
                    <h3 class="font-bold text-slate-950 text-lg pt-2">Detailed Guide & Sections</h3>
                    ${categoriesHtml}
                    <div class="bg-amber-50 border border-amber-200 rounded-2xl p-5 mt-6">
                        <h4 class="font-bold text-amber-900 text-sm mb-1 flex items-center">
                            <i class="fa-solid fa-lightbulb text-amber-600 mr-2"></i> Mamae's Real-Talk Tip:
                        </h4>
                        <p id="tipText" class="text-xs sm:text-sm text-amber-800 leading-relaxed">${(g.categories && g.categories[0] && g.categories[0].tip) ? g.categories[0].tip : g.tip}</p>
                    </div>
                </div>
            `;

            window.switchCategory = function(catName, btn) {
                const cat = g.categories.find(c => c.name === catName);
                if (!cat) return;
                document.getElementById('categoryContent').innerHTML = cat.content;
                document.getElementById('tipText').innerHTML = cat.tip || g.tip;
                document.querySelectorAll('.category-btn').forEach(b => {
                    b.className = "category-btn flex-shrink-0 whitespace-nowrap px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition bg-slate-100 hover:bg-slate-200 text-slate-700";
                });
                btn.className = "category-btn flex-shrink-0 whitespace-nowrap px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition bg-blue-600 text-white shadow-md";
            };
        });
    </script>
</body>
</html>
